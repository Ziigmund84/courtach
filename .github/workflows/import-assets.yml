name: Import des visuels du site d'origine
on:
  push:
    paths: ['.github/workflows/import-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les visuels
        run: |
          set -e
          B=https://baptistecourtachon.com/images
          mkdir -p assets/img assets/partenaires assets/video
          dl(){ curl -fsSL --retry 3 -A "Mozilla/5.0" "$B/$1" -o "$2" && echo "OK $1" || echo "MISSING $1"; }
          dl logo.png assets/img/logo.png
          dl site.jpg assets/img/site.jpg
          dl side-image.png assets/img/side-image.png
          dl Trackman-4.png assets/img/trackman.png
          dl secteurs/grip.jpg assets/img/grip.jpg
          dl secteurs/posture.jpg assets/img/posture.jpg
          dl secteurs/alignement.jpg assets/img/alignement.jpg
          dl revslider/uploads/baptiste2.png assets/img/baptiste2.png
          dl revslider/uploads/baptiste4.png assets/img/baptiste4.png
          dl background.jpg assets/img/background.jpg
          dl backgroundmobile3.jpg assets/img/background-mobile.jpg
          dl baptiste_contact.jpg assets/img/contact.jpg
          dl header-pattern.png assets/img/header-pattern.png
          dl 2024/09/03/copie-de-cours-co-hiver.png assets/img/affiche-cours-collectifs.png
          dl 2024/07/25/stage-16-22-decembre-2024-corrig.png assets/img/affiche-marrakech.png
          dl 2024/09/10/stage-enfants-28-31-octobre-2024.png assets/img/affiche-enfants.png
          for p in marcilly autret simac ecreci delecour richardladune solutioncorde valdefrancecourtage artcavic kryspelle; do dl partenaires/$p.png assets/partenaires/$p.png; done
          dl baptiste1080court.mp4 assets/video/hero.mp4
          find assets -type f -size 0 -delete
          ls -la assets/*
      - name: Optimiser les images
        run: |
          sudo apt-get install -y -qq webp >/dev/null
          for f in assets/img/*.jpg assets/img/*.png; do [ -f "$f" ] && cwebp -quiet -q 80 -resize 1600 0 "$f" -o "${f%.*}.webp" 2>/dev/null || cwebp -quiet -q 80 "$f" -o "${f%.*}.webp" || true; done
          ls -la assets/img
      - name: Enregistrer dans le repo et retirer ce workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/import-assets.yml
          git add assets
          git commit -m "Import des visuels du site d'origine"
          git push origin HEAD:main
